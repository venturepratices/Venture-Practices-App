name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # These never touch a real database or account — prisma generate only
      # reads the schema file, and `next build` doesn't run any live queries
      # (every DB-backed route in this app renders dynamically at request
      # time, not at build time). This job deliberately uses
      # `npm run build:ci` (prisma generate && next build), NOT the real
      # `npm run build` script — that one also runs `prisma migrate deploy`,
      # which must never run against an arbitrary/placeholder database.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-placeholder-secret-not-a-real-credential"
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking for now: the repo has ~46 pre-existing lint errors
      # (mostly a repeated react-hooks/set-state-in-effect pattern, unrelated
      # to any specific feature) that predate this CI check. Failing every
      # build on day one over pre-existing debt would just get the whole
      # check ignored/disabled. Once that debt is cleaned up, remove
      # `continue-on-error` so lint actually blocks merges again.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build:ci
